server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets for faster loads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively; Vite fingerprints filenames so
    # this is always safe — a new deploy produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any route that isn't a real file (e.g. /jobs/123,
    # /dashboard, /skill-gap) must still serve index.html so React Router
    # can take over client-side. Without this, refreshing on a deep link
    # 404s because nginx has no matching file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
