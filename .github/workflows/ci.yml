name: CI

# Runs on every push and PR against main/master so tests/build must pass
# before merging. No deployment happens here — Render and Vercel deploy
# from their own GitHub integrations independently of this workflow.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — checks & tests
    runs-on: ubuntu-latest

    # A throwaway Postgres service so the test suite runs against the same
    # database engine as production, catching SQLite/Postgres differences
    # (e.g. JSONField behaviour) before they reach Render.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: swipex_test
          POSTGRES_USER: swipex_user
          POSTGRES_PASSWORD: swipex_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swipex_user -d swipex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-not-used-in-production-only-for-pipeline
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://swipex_user:swipex_pass@localhost:5432/swipex_test
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          # A placeholder is fine here — CI only verifies the production
          # bundle compiles, it never talks to a live backend. The real
          # value is set as a Vercel project environment variable instead.
          VITE_API_BASE_URL: https://placeholder-api.example.com/api/v1
        run: npm run build

  docker-build:
    name: Docker — image build validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: swipex-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: swipex-frontend:ci
          build-args: |
            VITE_API_BASE_URL=https://placeholder-api.example.com/api/v1
