<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SwipeX</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: #080b1f;
            color: white;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-container {
            text-align: center;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;

            background: linear-gradient(
                90deg,
                #7c3aed,
                #2563eb,
                #06b6d4
            );

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 12px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 16px;
        }

        .loader {
            width: 40px;
            height: 40px;

            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;

            border-radius: 50%;

            margin: 25px auto;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }

    </style>

</head>

<body>

<div class="loading-container">

    <div class="logo">
        SwipeX
    </div>

    <p class="subtitle">
        AI Recruitment System
    </p>

    <div class="loader"></div>

    <p class="subtitle">
        Loading your dashboard...
    </p>

</div>


<script>

    /*
    ==========================================
    SWIPEX ROLE-BASED REDIRECTION
    ==========================================
    */

    const username =
        localStorage.getItem("swipex_username");

    const role =
        localStorage.getItem("swipex_role");


    /*
    ==========================================
    CHECK LOGIN
    ==========================================
    */

    if (!username || !role) {

        // No logged-in user
        // Send them to login page

        window.location.replace(
            "login.html"
        );

    }

    else {

        /*
        ======================================
        NORMALIZE ROLE
        ======================================
        */

        const normalizedRole =
            role
                .toLowerCase()
                .replace(/\s+/g, "");


        /*
        ======================================
        RECRUITER
        ======================================
        */

        if (
            normalizedRole === "recruiter"
        ) {

            window.location.replace(
                "recruiter.html"
            );

        }


        /*
        ======================================
        JOB SEEKER
        ======================================
        */

        else if (
            normalizedRole === "jobseeker"
        ) {

            window.location.replace(
                "jobseeker.html"
            );

        }


        /*
        ======================================
        UNKNOWN ROLE
        ======================================
        */

        else {

            console.error(
                "Unknown user role:",
                role
            );

            localStorage.clear();

            window.location.replace(
                "login.html"
            );

        }

    }

</script>

</body>

</html>
