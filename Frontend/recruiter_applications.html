<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Applicants - SwipeX</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background: #080b20;

            color: white;

            min-height: 100vh;

            padding: 30px;

        }


        .back-button {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 9px 15px;

            margin-bottom: 25px;

            border: 1px solid #293252;

            border-radius: 9px;

            background: #10162f;

            color: #cbd5e1;

            font-size: 13px;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .back-button:hover {

            background: #18203d;

            border-color: #3b82f6;

            color: white;

        }


        h1 {

            font-size: 27px;

            margin-bottom: 7px;

        }


        .subtitle {

            color: #8290b9;

            font-size: 14px;

            margin-bottom: 28px;

        }


        .applications-list {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        .application-card {

            display: flex;

            align-items: flex-start;

            gap: 16px;

            padding: 20px;

            background: #10162a;

            border: 1px solid #20294c;

            border-radius: 14px;

            transition: 0.25s ease;

        }


        .application-card:hover {

            transform: translateY(-2px);

            border-color: #3867d5;

            background: #131b34;

        }


        .application-icon {

            width: 50px;

            height: 50px;

            flex-shrink: 0;

            border-radius: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            background:
                linear-gradient(
                    135deg,
                    #7139e8,
                    #158edc
                );

        }


        .application-details {

            flex: 1;

        }


        .application-details h2 {

            font-size: 16px;

            margin-bottom: 7px;

        }


        .application-details p {

            color: #8b98bc;

            font-size: 13px;

            margin-top: 7px;

        }


        .status-text {

            font-weight: 600;

        }


        .status-text.pending {

            color: #facc15;

        }


        .status-text.accepted {

            color: #4ade80;

        }


        .status-text.rejected {

            color: #f87171;

        }


        .application-actions {

            display: flex;

            gap: 10px;

            margin-top: 16px;

        }


        .accept-button,
        .reject-button {

            border: none;

            border-radius: 8px;

            padding: 9px 16px;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .accept-button {

            background: #16a34a;

            color: white;

        }


        .accept-button:hover {

            background: #15803d;

            transform: translateY(-1px);

        }


        .reject-button {

            background: #dc2626;

            color: white;

        }


        .reject-button:hover {

            background: #b91c1c;

            transform: translateY(-1px);

        }


        .decision {

            margin-top: 16px;

            padding: 10px 14px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: 600;

            display: inline-block;

        }


        .decision.accepted {

            background:
                rgba(34, 197, 94, 0.12);

            color: #4ade80;

            border:
                1px solid
                rgba(34, 197, 94, 0.25);

        }


        .decision.rejected {

            background:
                rgba(248, 113, 113, 0.12);

            color: #f87171;

            border:
                1px solid
                rgba(248, 113, 113, 0.25);

        }


        .empty-state {

            text-align: center;

            padding: 70px 20px;

            border: 1px solid #20294c;

            border-radius: 15px;

            background: #10162a;

        }


        .empty-icon {

            font-size: 45px;

            margin-bottom: 15px;

        }


        .empty-state h2 {

            font-size: 20px;

            margin-bottom: 8px;

        }


        .empty-state p {

            color: #7f8cb3;

            font-size: 13px;

        }


        @media (max-width: 650px) {

            body {

                padding: 20px;

            }


            h1 {

                font-size: 23px;

            }


            .application-card {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<button
    class="back-button"
    onclick="goBackToDashboard()">

    ← Back to Dashboard

</button>


<h1>
    👥 Applicants
</h1>


<p class="subtitle">
    Review candidates who have applied to your jobs.
</p>


<div
    id="applicationsList"
    class="applications-list">

</div>

<script src="api-config.js"></script>
<script src="recruiter_applications.js"></script>


</body>

</html>
