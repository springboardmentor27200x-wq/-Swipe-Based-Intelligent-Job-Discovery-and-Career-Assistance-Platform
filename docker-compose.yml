version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: swipex_db
      POSTGRES_USER: swipex_user
      POSTGRES_PASSWORD: swipex_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swipex_user -d swipex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    # collectstatic runs here (not only at image build time) because the
    # ./backend:/app bind mount below replaces the image's baked-in
    # staticfiles/ with the host's copy for local iteration — running it
    # again on every start keeps WhiteNoise serving fresh static files.
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn swipex.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-for-local-docker-testing-only}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://swipex_user:swipex_pass@db:5432/swipex_db
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:5173
      FRONTEND_URL: http://localhost:3000
      # Compose runs everything over plain HTTP on localhost — force this
      # off so SECURE_SSL_REDIRECT doesn't redirect-loop without real TLS.
      SECURE_SSL_REDIRECT: "False"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-side requests go to localhost:8000 (mapped above), not the
        # internal "backend" service hostname — the browser is outside the
        # compose network.
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
