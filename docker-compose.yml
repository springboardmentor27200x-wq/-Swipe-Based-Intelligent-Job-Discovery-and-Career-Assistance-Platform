version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=swipex
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=swipexpassword
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: gunicorn swipex.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
    environment:
      - SECRET_KEY=django-insecure-swipex-platform-secret-key-1234567890
      - DEBUG=True
      - ALLOWED_HOSTS=backend,localhost,127.0.0.1
      - DATABASE_URL=postgres://postgres:swipexpassword@db:5432/swipex
      - FRONTEND_URL=http://localhost
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build: ./backend
    command: celery -A swipex worker -l info
    volumes:
      - ./backend:/app
    environment:
      - SECRET_KEY=django-insecure-swipex-platform-secret-key-1234567890
      - DEBUG=True
      - DATABASE_URL=postgres://postgres:swipexpassword@db:5432/swipex
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
